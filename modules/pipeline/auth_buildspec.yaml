version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies for migrations..."
      - npm ci
  pre_build:
    commands:
      - echo "🗄️ Running database migrations FIRST..."
      - echo "Migration started at $(date)"
      - export NODE_ENV=production
      - npm run migrate:up
      - echo "✅ Migrations completed successfully!"
      - echo ""
      - echo "Migrations completed successfully!"
      - echo "Creating .env file from secrets..."
      - aws secretsmanager get-secret-value --region $AWS_DEFAULT_REGION --secret-id opalink/prod/auth --output json | jq -r '.SecretString' | jq 'to_entries | .[] | "\(.key)=\(.value)"' | tr -d \" > .env
      - echo "Environment file created!"
      - echo "🐳 Now proceeding with Docker build..."
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 263427518575.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build started on date
      - echo Building the Docker image...
      - docker build --build-arg AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID --build-arg AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY --build-arg AWS_DEFAULT_REGION=us-east-1 -t auth-prod .
      - docker tag auth-prod:latest 263427518575.dkr.ecr.us-east-1.amazonaws.com/auth-prod:latest

  post_build:
    commands:
      - echo Build completed on date
      - echo Pushing the Docker image...
      - docker push 263427518575.dkr.ecr.us-east-1.amazonaws.com/auth-prod:latest
      - echo Writing imagedefinitions.json file...
      - printf '[{"name":"auth","imageUri":"263427518575.dkr.ecr.us-east-1.amazonaws.com/auth-prod:latest"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json